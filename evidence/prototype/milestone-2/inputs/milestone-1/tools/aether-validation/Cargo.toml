[package]
name = "aether-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "aether-validate"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sha1 = "=0.10.6"

[dev-dependencies]
tempfile = "=3.27.0"
